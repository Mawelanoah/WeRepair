<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | WeRepair</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .container { max-width: 500px; }
    .icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #1e90ff, #4dabf7);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 2rem;
    }
    h1 { font-size: 2.5rem; margin-bottom: 12px; }
    p { color: #c0c0c0; margin-bottom: 32px; line-height: 1.6; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #1e90ff; color: white; padding: 14px 28px;
      border-radius: 10px; text-decoration: none; font-weight: 600;
      transition: 0.25s;
    }
    .btn:hover { background: #1565c0; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"><i class="fas fa-tools"></i></div>
    <h1>404</h1>
    <p>Sorry, the page you’re looking for doesn’t exist. Let’s get you back to WeRepair.</p>
    <a href="index.html" class="btn"><i class="fas fa-home"></i> Back to Home</a>
  </div>
</body>
</html>
